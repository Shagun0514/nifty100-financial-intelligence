# Screener threshold definitions — Day 15-16.
# Analysts can edit these thresholds directly; no code changes needed.
# Supported filter keys (15 total): roe_min, de_max, fcf_min, revenue_cagr_5yr_min,
# pat_cagr_5yr_min, opm_min, pe_max, pb_max, dividend_yield_min, icr_min, market_cap_min,
# net_profit_min, eps_cagr_min, asset_turnover_min, sales_min
# Special rules (handled in engine.py, not here):
#   - de_max: companies in the Financials sector are automatically skipped for this filter
#   - icr_min: 'Debt Free' (ICR=None) is treated as infinity and always passes

presets:
  quality_compounder:
    label: "Quality Compounder"
    filters:
      roe_min: 15
      de_max: 1.0
      fcf_min: 0
      revenue_cagr_5yr_min: 10

  value_pick:
    label: "Value Pick"
    filters:
      pe_max: 20
      pb_max: 3.0
      de_max: 2.0
      dividend_yield_min: 1

  growth_accelerator:
    label: "Growth Accelerator"
    filters:
      pat_cagr_5yr_min: 20
      revenue_cagr_5yr_min: 15
      de_max: 2.0

  dividend_champion:
    label: "Dividend Champion"
    filters:
      dividend_yield_min: 2
      dividend_payout_max: 80
      fcf_min: 0

  debtfree_bluechip:
    label: "Debt-Free Blue Chip"
    filters:
      de_max: 0
      roe_min: 12
      sales_min: 5000

  turnaround_watch:
    label: "Turnaround Watch"
    filters:
      revenue_cagr_3yr_min: 10
      fcf_positive_latest: true
      de_declining_yoy: true

composite_score_weights:
  profitability: 0.35   # ROE 15% + ROCE 10% + NPM 10%
  cash_quality: 0.30    # FCF CAGR 15% + CFO/PAT 10% + FCF positive flag 5%
  growth: 0.20          # Revenue CAGR 10% + PAT CAGR 10%
  leverage: 0.15        # D/E score 10% + ICR score 5%
